<!DOCTYPE html>
<html>
<head>
    <title>PPG Pulse Extractor</title>
    <style>
        .analysis-box {
            background: #f8f8f8;
            padding: 15px;
            border-radius: 8px;
            line-height: 1.6;
            font-size: 15px;
            border: 1px solid #ddd;
            margin-top: 10px;
        }

        #result h3 {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
<h2>Upload Video to Extract Pulse</h2>

<input type="file" id="videoInput" accept="video/*">
<button onclick="uploadVideo()">Upload & Analyze</button>

<p id="result"></p>

<script>
    function formatLLMText(text) {
        // Convert **bold** → <strong>
        text = text.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");

        // Convert newlines → <br>
        text = text.replace(/\n/g, "<br>");

        return text;
    }

    async function uploadVideo() {
        const fileInput = document.getElementById("videoInput");
        if (!fileInput.files.length) {
            alert("Please select a video file");
            return;
        }

        const formData = new FormData();
        formData.append("video", fileInput.files[0]);

        const response = await fetch("http://127.0.0.1:8000/extract_pulse", {
            method: "POST",
            body: formData
        });
        console.log("------------response ", response);
        if (!response.ok) {
            console.error("Server error:", response.status);
        }

        // const data = await response.json();
        const text = await response.text();
        console.log("RAW TEXT:", text);

        let data;
        try {
            data = JSON.parse(text);
        } catch (e) {
            console.error("JSON parse error:", e);
        }
        const formatted = formatLLMText(data.llm_analysis);

        console.log("------------data ", data);
        document.getElementById("result").innerHTML = `
            <h3>Heart Rate: ${data.bpm} BPM</h3>
            <div class="analysis-box">${formatted}</div>
        `;
    }
</script>
</body>
</html>
